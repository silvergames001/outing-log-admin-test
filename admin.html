<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfb">
<meta name="robots" content="noindex,nofollow">
<title>관리자-외출기입대장</title>
<style>
:root{
  --bg-main:#fbfbfb;--card:#fff;--line:#e5e8eb;--gray-fill:#f3f4f6;
  --ink:#333d4b;--muted:#8b95a1;--blue-main:#3182f6;--blue-light:#c9e4ff;
  --error:#f04452;--error-bg:#fed6d6;
  --toss-spring:cubic-bezier(.16,1,.3,1);--toss-bounce:cubic-bezier(.34,1.56,.64,1);--toss-sheet:cubic-bezier(.65,0,0,1);
  --press-in:.13s cubic-bezier(.3,.7,.25,1);--press-out:.42s cubic-bezier(.2,1.32,.4,1);
  --panel:.52s cubic-bezier(.25,.7,.2,1);
  --press-scale-sm:.88;--press-scale-md:.92;--press-scale-lg:.95;
}
@supports (transition-timing-function: linear(0, 1)) {
      :root {
        --press-in: 0.2s linear(0, 0.0236, 0.0821, 0.1611, 0.25, 0.3416, 0.4308, 0.5146, 0.5911, 0.6594, 0.7194, 0.7712, 0.8153, 0.8525, 0.8835, 0.909, 0.9297, 0.9465, 0.9599, 0.9705, 0.9787, 0.9851, 0.9899, 0.9935, 0.9962, 0.9981, 0.9995, 1.0004, 1.001, 1.0013, 1.0015, 1.0015, 1.0015, 1.0014, 1);      /* 감쇠 0.9 · 4.5Hz */
        --press-out: 0.62s linear(0, 0.0244, 0.0894, 0.1832, 0.2954, 0.4168, 0.5397, 0.658, 0.7672, 0.864, 0.9467, 1.0142, 1.0667, 1.1048, 1.13, 1.1437, 1.1477, 1.1439, 1.1342, 1.1203, 1.1037, 1.0857, 1.0676, 1.0501, 1.034, 1.0198, 1.0076, 0.9977, 0.99, 0.9844, 0.9807, 0.9788, 0.9782, 0.9788, 0.9802, 0.9823, 0.9847, 0.9874, 0.9901, 0.9926, 0.995, 0.9971, 0.9989, 1.0004, 1);   /* 감쇠 0.52 · 2.6Hz (반동) */
        --slide: 0.36s linear(0, 0.0246, 0.0844, 0.1631, 0.25, 0.338, 0.4226, 0.5012, 0.5727, 0.6363, 0.6923, 0.7409, 0.7828, 0.8187, 0.8491, 0.8748, 0.8964, 0.9145, 0.9296, 0.9421, 0.9525, 0.9611, 0.9682, 0.9741, 0.9788, 0.9828, 0.986, 0.9886, 0.9908, 0.9925, 0.9939, 0.9951, 1);           /* 감쇠 1.0 · 3.4Hz */
        --panel: 0.6s linear(0, 0.0216, 0.0748, 0.146, 0.2258, 0.308, 0.3883, 0.4643, 0.5344, 0.5979, 0.6547, 0.7049, 0.7488, 0.787, 0.82, 0.8483, 0.8725, 0.8931, 0.9105, 0.9253, 0.9377, 0.9482, 0.9569, 0.9643, 0.9704, 0.9755, 0.9798, 0.9833, 0.9862, 0.9886, 0.9906, 0.9923, 1);            /* 감쇠 1.0 · 1.9Hz */
        --modal: 0.34s linear(0, 0.0211, 0.0732, 0.1431, 0.2217, 0.3028, 0.3824, 0.4578, 0.5276, 0.5911, 0.6479, 0.6983, 0.7425, 0.7811, 0.8145, 0.8433, 0.8679, 0.8889, 0.9068, 0.922, 0.9348, 0.9456, 0.9547, 0.9623, 0.9687, 0.974, 0.9785, 0.9822, 0.9852, 0.9878, 0.9899, 0.9917, 0.9932, 0.9944, 1);           /* 감쇠 1.0 · 2.6Hz */
        --toss-spring: linear(0, 0.0246, 0.0844, 0.1631, 0.25, 0.338, 0.4226, 0.5012, 0.5727, 0.6363, 0.6923, 0.7409, 0.7828, 0.8187, 0.8491, 0.8748, 0.8964, 0.9145, 0.9296, 0.9421, 0.9525, 0.9611, 0.9682, 0.9741, 0.9788, 0.9828, 0.986, 0.9886, 0.9908, 0.9925, 0.9939, 0.9951, 1);
        --toss-sheet: linear(0, 0.0218, 0.0752, 0.1468, 0.227, 0.3094, 0.39, 0.4661, 0.5363, 0.5998, 0.6566, 0.7067, 0.7505, 0.7886, 0.8215, 0.8496, 0.8737, 0.8942, 0.9115, 0.9262, 0.9385, 0.9489, 0.9576, 0.9648, 0.9709, 0.9759, 0.9801, 0.9836, 0.9865, 0.9889, 0.9908, 0.9925, 1);
        /* 원본 --toss-sheet은 표본 끝값이 0.9925→1로 강제 스냅되면서 마지막 프레임에서
           속도가 순간적으로 튀어 '버벅임'으로 보임. 동일한 감쇠(임계감쇠)로 다시 표본화해
           끝까지 감속폭이 매끄럽게 줄어들도록 보정. 바텀시트/센터모달 등장에만 사용. */
        --sheet-enter: linear(0, 0.0388, 0.1273, 0.2365, 0.3491, 0.4557, 0.5515, 0.6348, 0.7055, 0.7643, 0.8127, 0.852, 0.8836, 0.9088, 0.9289, 0.9447, 0.9572, 0.9669, 0.9745, 0.9804, 0.9849, 0.9884, 0.9912, 0.9932, 0.9948, 0.9961, 0.997, 0.9977, 0.9983, 0.9987, 0.999, 0.9993, 0.9994, 0.9996, 0.9997, 0.9998, 1);
        --toss-nav: linear(0, 0.0246, 0.0844, 0.1631, 0.25, 0.338, 0.4226, 0.5012, 0.5727, 0.6363, 0.6923, 0.7409, 0.7828, 0.8187, 0.8491, 0.8748, 0.8964, 0.9145, 0.9296, 0.9421, 0.9525, 0.9611, 0.9682, 0.9741, 0.9788, 0.9828, 0.986, 0.9886, 0.9908, 0.9925, 0.9939, 0.9951, 1);
        /* 튀어오르는 모션(팝·체크 등)은 반동이 있는 스프링으로 */
        --toss-bounce: linear(0, 0.0244, 0.0894, 0.1832, 0.2954, 0.4168, 0.5397, 0.658, 0.7672, 0.864, 0.9467, 1.0142, 1.0667, 1.1048, 1.13, 1.1437, 1.1477, 1.1439, 1.1342, 1.1203, 1.1037, 1.0857, 1.0676, 1.0501, 1.034, 1.0198, 1.0076, 0.9977, 0.99, 0.9844, 0.9807, 0.9788, 0.9782, 0.9788, 0.9802, 0.9823, 0.9847, 0.9874, 0.9901, 0.9926, 0.995, 0.9971, 0.9989, 1.0004, 1);
      }
    }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent!important;touch-action:manipulation!important}
button,input{outline:none}
html,body{height:100dvh;overflow:hidden;overscroll-behavior-y:none}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg-main);color:var(--ink);display:flex;flex-direction:column;max-width:480px;margin:0 auto;-webkit-user-select:none;user-select:none}
body{transition:background-color .35s ease}
body.is-login{background:var(--card)}
@keyframes viewIn{0%{opacity:0}100%{opacity:1}}
#loginView,#adminView{animation:viewIn .42s ease backwards}
header{animation:viewIn .42s ease backwards}
.fade-out{opacity:0!important;transition:opacity .24s ease!important;pointer-events:none!important}
input{-webkit-user-select:text;user-select:text}
.hide{display:none!important}

/* header */
header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 24px 24px;position:relative;z-index:10;background:inherit}
header::after{content:"";position:absolute;bottom:-24px;left:0;width:100%;height:24px;background:linear-gradient(to bottom,var(--bg-main),rgba(251,251,251,0));pointer-events:none}
.who{line-height:1.4;display:flex;flex-direction:column}
.who b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.who span{font-size:13px;color:var(--muted);font-weight:500;margin-top:3px}
@keyframes dropInTop{0%{opacity:0;transform:translateY(-22px)}100%{opacity:1;transform:none}}
header.drop>*{animation:dropInTop .6s var(--toss-sheet) backwards}

/* views */
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 20px 0;display:flex;flex-direction:column;gap:32px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.page>*{animation:fadeInUp .5s var(--toss-spring) backwards}
.page>*:nth-child(2){animation-delay:.08s}.page>*:nth-child(3){animation-delay:.14s}.page>*:nth-child(4){animation-delay:.2s}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
.label{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px}
.label small{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.hint{font-size:13px;color:var(--muted);font-weight:500;line-height:1.5;margin-top:10px}

/* login */
.setup-header-row{display:flex;align-items:center;gap:18px;padding-top:16px}
.setup-title-col h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
.setup-title-col p{font-size:14px;color:var(--muted);font-weight:500}
.idcard-small{width:105px;flex-shrink:0;overflow:visible!important;filter:drop-shadow(4px 12px 24px rgba(49,130,246,.3));transform:rotate(-5deg);animation:cardFloat 4s ease-in-out infinite}
@keyframes cardFloat{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-5deg) translateY(-6px)}}
.cardshine{animation:cardSweep 4.5s ease-in-out infinite}
@keyframes cardSweep{0%,60%{transform:translateX(-120px) skewX(-20deg)}85%,100%{transform:translateX(240px) skewX(-20deg)}}

input[type=text],input[type=password],input[type=time]{width:100%;background:var(--gray-fill);border:1px solid transparent;border-radius:14px;padding:18px 16px;font-size:16px;font-family:inherit;color:var(--ink);font-weight:500;transition:border-color .5s ease,background-color .5s ease}
input:focus{background:var(--card);border-color:var(--blue-main)}
::placeholder{color:#b0b8c1;font-weight:500}

/* press effect (원본과 동일) */
.btn-simple,.chip,.mgr-item,.latelink,.stepper-btn,.rbtn,.cm-btn,.gban,.sortbtn{transition:transform var(--press-out),background-color var(--press-out),border-color var(--press-out),filter var(--press-out)!important}
.btn-simple:active,.btn-simple.pressed,.chip:active,.chip.pressed,.mgr-item:active,.mgr-item.pressed,.latelink:active,.latelink.pressed,.cm-btn:active,.cm-btn.pressed,.gban:active,.gban.pressed,.sortbtn:active,.sortbtn.pressed{transform:scale(var(--press-scale-lg))!important;filter:brightness(.92)!important;transition:transform var(--press-in),filter var(--press-in),background-color var(--press-in)!important}
.stepper-btn:active,.stepper-btn.pressed,.rbtn:active,.rbtn.pressed{transform:scale(var(--press-scale-md))!important;filter:brightness(.92)!important;transition:transform var(--press-in),filter var(--press-in),background-color var(--press-in)!important}
.btn-simple{border:none;cursor:pointer;font-family:inherit;border-radius:16px;font-weight:600;letter-spacing:-.01em}
.btn-simple:disabled{opacity:.6;pointer-events:none}

/* list */
.list{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:8px}
.mgr-item{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:transparent;border:none;border-radius:16px;padding:12px 12px;font-size:15.5px;font-weight:600;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
.mgr-item:active,.mgr-item.pressed{background:var(--gray-fill)}
.mgr-item .ava{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;background:linear-gradient(160deg,#9BA9D6,#7C89C4)}
.mgr-item .icon-wrap{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--gray-fill);color:var(--blue-main);flex-shrink:0}
.mgr-item .icon-wrap svg{width:19px;height:19px}
.mgr-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgr-item .nm small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.tag{flex-shrink:0;padding:4px 7px;border-radius:7px;background:var(--blue-light);color:var(--blue-main);font-size:12px;font-weight:700}
.tag.ban{background:var(--error-bg);color:var(--error)}
.chip.sel.r{background:var(--error-bg);color:var(--error)}
.tag.off{background:var(--gray-fill);color:var(--muted)}
.stepper-btn{flex:0 0 auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--gray-fill);border:1px solid transparent;border-radius:14px;font-size:26px;font-weight:700;line-height:1;color:var(--ink);cursor:pointer;font-family:inherit}
.stepper-btn.minus{color:var(--error)}
.stepper-btn.plus{color:var(--blue-main)}
.stepper-btn.wide{width:100%;height:48px;margin-top:8px;font-size:15.5px;gap:6px}
.bsum-wrap{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.bsum{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--gray-fill,#f2f4f6);font-size:16px}
.bsum svg{width:26px;height:26px;flex-shrink:0}
.bsum-t{flex:1;font-weight:700;color:#4e5968}
.bsum b{font-size:18px;font-weight:800;color:#191f28}
.bsum.red b{color:#f04452}
.bsum.yel b{color:#9a5b00}
.arow{padding:9px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow-h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.anode{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.anode svg{width:12px;height:12px}
.anode.out{background:var(--blue-light);color:var(--blue-main)}
.anode.back{background:var(--error-bg);color:var(--error)}
.anode.late{background:#fff3cf;color:#9a5b00}
.arow-t{margin:3px 0 0 32px;font-size:14.5px;font-weight:700;color:var(--ink);word-break:break-all}
.arow-t span{font-weight:500;color:var(--muted)}
.lg-box{overflow:hidden}
.dn-rv{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.dn-rv.off{grid-template-rows:0fr;opacity:0;pointer-events:none}
.dn-rv>div{overflow:hidden;min-height:0}
.dnav{display:flex;align-items:center;justify-content:space-between;padding:0 0 8px}
.dbtn{width:44px;height:36px;border:0;border-radius:12px;background:var(--gray-fill);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:transform .3s cubic-bezier(.2,1.3,.4,1),opacity .25s ease,background-color .25s ease}
.dbtn svg{width:18px;height:18px}
.dbtn:active:not(:disabled){transform:scale(.9)}
.dbtn:disabled{opacity:.3;cursor:default}
.dlbl{flex:1;min-height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:700;color:var(--ink);line-height:1.25}
.dlbl small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:1px}
.lg-in{animation:lgIn .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes lgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px;font-weight:500;grid-column:1/-1}

/* 학생 관리 헤더: [제목] ........ [전체 밴] [🔎 검색…] */
.sec-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-head .label{margin:0;flex:1;min-width:0;white-space:nowrap}
.gban{flex:0 0 auto;display:flex;align-items:center;gap:5px;height:38px;padding:0 12px;border:none;border-radius:12px;background:var(--error-bg);color:var(--error);font-size:14px;font-weight:700;font-family:inherit;letter-spacing:-.01em;white-space:nowrap;cursor:pointer}
.gban svg{width:15px;height:15px;flex-shrink:0}
.gban .gdot{display:none;width:6px;height:6px;border-radius:50%;background:var(--error)}
.sortbtn{flex:0 0 auto;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;border-radius:12px;background:#191f28;color:#fff;cursor:pointer;font-family:inherit}
.sortbtn svg{width:16px;height:16px}
.gban.on{background:var(--error);color:#fff}
.gban.on .gdot{display:block;background:#fff}
.stq{flex:0 1 104px;min-width:0;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;background:var(--gray-fill);border:1px solid transparent;border-radius:12px;color:var(--muted);transition:border-color .5s ease,background-color .5s ease}
.stq:focus-within{background:var(--card);border-color:var(--blue-main)}
.stq svg{width:16px;height:16px;flex-shrink:0}
.stq input[type=text]{flex:1;min-width:0;width:100%;height:100%;padding:0;background:transparent;border:none;border-radius:0;font-size:14px}
.stq input[type=text]:focus{background:transparent;border-color:transparent}

/* 학생 카드 (한 줄 3명) — 버튼은 카드 오른쪽 윤곽에 걸쳐 배치 */
.stu-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin-top:14px}
.stu{position:relative;aspect-ratio:1/1.3;display:flex;flex-direction:column;background:#eceef1;border:2px solid transparent;border-radius:16px;padding:4px;transition:background-color .3s ease,border-color .3s ease}
.stu-img{position:relative;flex:1;min-height:0;border-radius:11px;background:transparent;overflow:hidden;transition:background-color .3s ease}
.stu-sil{position:absolute;left:50%;top:46%;width:62%;transform:translate(-50%,-50%);fill:#fff;transition:fill .3s ease}
.stu-ov{position:absolute;left:4px;right:4px;bottom:4px;z-index:1;min-width:0}
.mg-row{display:inline-flex;align-items:center;gap:6px;min-width:0;vertical-align:middle}
.mg-lb{flex-shrink:0;font-size:13px;color:var(--muted);font-weight:500}
.mgr-icon{display:inline-flex;width:24px;height:24px;flex-shrink:0;overflow:visible}
.mgr-tag{display:inline-block;padding:4px 7px;border-radius:7px;background:var(--blue-light);color:var(--blue-main);font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.3;white-space:nowrap;flex-shrink:1;min-width:0}
.stu-ov{display:flex;align-items:center;gap:2px}
.stu-mg{flex:0 1 auto;min-width:0;padding:2px 3px;border-radius:4px;background:var(--blue-light);color:var(--blue-main);font-size:9px;font-weight:700;letter-spacing:-.02em;line-height:1.3;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu-mg.ic{display:inline-flex;width:16px;height:16px;padding:0;background:none;overflow:visible}
.stu-nm{flex:0 0 auto;max-width:68%;display:block;font-size:12px;font-weight:700;color:#4e5968;letter-spacing:-.02em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu.lock{cursor:pointer}
.stu.lock .stu-btns{display:none}
.stu-st{flex-shrink:0;min-height:26px;padding:3px 2px 2px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:800;letter-spacing:-.03em;line-height:1.2;word-break:keep-all}
.stu-btns{position:absolute;top:8px;right:-2px;transform:translateX(50%);z-index:2;display:flex;flex-direction:column;gap:6px}
.rbtn{width:28px;height:28px;padding:0;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 0 0 2.5px var(--bg-main),0 2px 6px rgba(0,0,0,.14)}
.rbtn svg{width:15px;height:15px}
.rbtn.del{color:var(--error)}
.rbtn.bn{background:var(--error-bg);color:var(--error)}
.rbtn.lg{background:var(--blue-light);color:var(--blue-main)}
/* 밴(차단): 빨간 테두리 + 분홍 카드, 검붉은 버튼 */
.stu.ban{background:#ffb8bc;border-color:var(--error)}
.stu.ban .stu-img{background:#b46a6f}
.stu.ban .stu-nm,.stu.tmp .stu-nm{color:#fff}
.stu.ban .stu-sil{fill:rgba(255,255,255,.24)}
.stu-st svg{width:14px;height:14px;flex-shrink:0;margin-right:3px}
.stu.ban .stu-st{color:#e11d2e}
.stu.ban .rbtn{background:#6e171d;color:#ffd0d4}
.stu.ban .rbtn.bn{background:#3d0b0f;color:#ff6b75;box-shadow:0 0 0 2px var(--error),0 0 0 4.5px var(--bg-main)}
/* 일시 제한: 노란색, 같은 스타일 */

      height: 14px;

@keyframes tossShake{0%,100%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}85%{transform:translateX(1px)}}
.err{animation:tossShake .45s cubic-bezier(.36,.07,.19,.97) both!important;border-color:var(--error)!important;background-color:var(--error-bg)!important;transition:background-color .2s ease,border-color .2s ease!important}
@keyframes cmShake{0%,100%{transform:translate(-50%,-50%)}15%{transform:translate(calc(-50% - 6px),-50%)}30%{transform:translate(calc(-50% + 6px),-50%)}45%{transform:translate(calc(-50% - 4px),-50%)}60%{transform:translate(calc(-50% + 4px),-50%)}80%{transform:translate(calc(-50% - 2px),-50%)}}

.bottom-sheet{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:11px;right:11px;width:calc(100% - 22px);max-width:458px;margin:0 auto;background:var(--bg-main);border-radius:22px;z-index:1101;padding:32px 18px 21px;opacity:0;transform:translateY(120%) scale(1.05);visibility:hidden;transition:transform .45s cubic-bezier(.3,0,.1,1),opacity .35s ease,visibility .45s ease,background-color .4s ease;display:flex;flex-direction:column;gap:20px;box-shadow:0 12px 40px rgba(0,0,0,.15)}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 로그인 토큰: index.html과 같은 방식으로 sessionStorage + localStorage + 쿠키에 함께 저장

const TK='adm_tk';
function getCookie(n){try{const k=n+'=';for(let c of document.cookie.split(';')){c=c.trim();if(c.indexOf(k)===0)return decodeURIComponent(c.slice(k.length))}}catch(e){}return null}
function setCookie(n,v,days){try{const d=new Date(Date.now()+days*864e5);document.cookie=n+'='+encodeURIComponent(v)+';expires='+d.toUTCString()+';path=/;SameSite=Lax'}catch(e){}}
function dualGet(k){
  let v=null;
  try{v=sessionStorage.getItem(k)}catch(e){}
  if(!v){try{v=localStorage.getItem(k)}catch(e){}}
  if(!v)v=getCookie(k);
  if(v){try{sessionStorage.setItem(k,v)}catch(e){}try{localStorage.setItem(k,v)}catch(e){}}
  return v||'';
}
const saveTok=t=>{try{sessionStorage.setItem(TK,t)}catch(e){}try{localStorage.setItem(TK,t)}catch(e){}setCookie(TK,t,30)};

/* ---------- press feedback (원본 동일) ---------- */
(function(){
  const SEL='.btn-simple,.chip,.mgr-item,.latelink,.stepper-btn,.rbtn,.cm-btn,.gban,.ptab,.sortbtn,.dd-item';
  let el=null,t0=0,sx=0,sy=0;
  /* 선택된 탭을 누르면 뒤의 이동 하이라이트(.purpose-bg)도 같이 눌림 (index.html과 동일) */
  const hlOf=x=>x&&x.classList.contains('ptab')&&x.classList.contains('sel')?x.closest('.purpose-tabs').querySelector('.purpose-bg'):null;
  const clear=()=>{if(el){el.classList.remove('pressed');const h=hlOf(el);if(h)h.classList.remove('is-pressed');el=null}};
  document.addEventListener('touchstart',e=>{const x=e.target.closest(SEL);clear();if(!x||x.disabled)return;el=x;t0=Date.now();sx=e.touches[0].clientX;sy=e.touches[0].clientY;x.classList.add('pressed');const h=hlOf(x);if(h)h.classList.add('is-pressed')},{passive:true});
  document.addEventListener('touchmove',e=>{if(!el)return;if(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10)clear()},{passive:true});
  document.addEventListener('touchend',()=>{if(!el)return;const x=el;el=null;const w=Math.max(0,170-(Date.now()-t0));const h=hlOf(x);setTimeout(()=>{x.classList.remove('pressed');if(h)h.classList.remove('is-pressed')},w)},{passive:true});
  document.addEventListener('touchcancel',clear,{passive:true});
})();

/* ---------- login / logout / save ---------- */
function doLogin(){
  const pw=$('pw').value;
  if(!pw){shake($('pw'));toast('비밀번호를 입력해주세요');return}
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  busy($('btnLogin'),true);
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:pw})})
    .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'로그인에 실패했어요');return j})
    .then(j=>{token=j.token;saveTok(token);return load()})
    .then(()=>{busy($('btnLogin'),false);showAdmin()})
    .catch(e=>{busy($('btnLogin'),false);shake($('pw'));toast(e.message)});
}
$('btnLogin').onclick=doLogin;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function closeLogout(){$('loOv').classList.remove('show');$('lo').classList.remove('show')}

$('loNo').onclick=closeLogout;$('loOv').onclick=closeLogout;

$('btnSave').onclick=()=>{
  if(saving)return;
  if(!dirty){toast('변경사항이 없어요');return}
  saving=true;busy($('btnSave'),true);
  api({action:'save',config:cfg}).then(c=>{
    cfg={managers:c.managers,sheets:c.sheets};render();setDirty(false);toast('저장했어요');
  }).catch(e=>{
    toast(e.message);if(e.status===401)setTimeout(showLogin,900);
  }).finally(()=>{saving=false;busy($('btnSave'),false)});
};

/* 제한 시간(한국 시간 기준)에 지금 걸려 있으면 풀리는 시각을 구한다 — student.js의 판정과 동일 */
const p2=n=>String(n).padStart(2,'0');
const toMin=t=>+t.slice(0,2)*60+ +t.slice(3);
const inWin=(w,n)=>{const a=toMin(w.s),b=toMin(w.e);return a<b?(n>=a&&n<b):(n>=a||n<b)};
function liftOf(wins){
  const d=new Date(Date.now()+9*3600e3),n=d.getUTCHours()*60+d.getUTCMinutes();
  if(!wins.some(w=>inWin(w,n)))return null;
  for(let k=1;k<=1440;k++){const m=(n+k)%1440;if(!wins.some(w=>inWin(w,m)))return{t:p2(m/60|0)+':'+p2(m%60),next:n+k>=1440,k}}
  return{t:''};
}
/* 카드 상태: 차단=빨강(ban) · 타임 아웃/지금 제한 시간 중=노랑(tmp) · 그 외 회색 */
const remTxt=k=>{const h=k/60|0,m=k%60;return (h?h+'시간 ':'')+(m?m+'분 ':'')+'남음'};
function nextStart(ws){
  const d=new Date(Date.now()+9*3600e3),n=d.getUTCHours()*60+d.getUTCMinutes();
  return ws.map(w=>({s:w.s,k:(toMin(w.s)-n+1440)%1440})).sort((a,b)=>a.k-b.k)[0].s;
}
const isForever=ws=>(ws||[]).some(w=>w.s===w.e);
const kstMin=()=>{const d=new Date(Date.now()+9*3600e3);return d.getUTCHours()*60+d.getUTCMinutes()};
const hm=m=>{m=((m%1440)+1440)%1440;return p2(m/60|0)+':'+p2(m%60)};
function stState(r){
  if(r.status==='banned')return{c:'ban',txt:'금지됨',ic:I_STBAN,lock:1};
  if(r.status==='paused'){
    const ws=r.wins||[],pl=liftOf(ws);
    if(pl&&pl.k)return{c:'tmp',txt:pl.k>=60?remTxt(pl.k).replace(' 남음',''):remTxt(pl.k),ic:I_STPAUSE,lock:1};
    return{c:'tmp',txt:ws.length?nextStart(ws)+' 시작':'금지됨',ic:I_STPAUSE,lock:1};
  }
  const l=liftOf((glob.wins||[]).concat(r.wins||[]));
  if(l)return l.t?{c:'tmp',txt:(l.next?'내일 ':'')+l.t+' 해제',ic:I_STPAUSE,lock:1,g:1}:{c:'ban',txt:'금지됨',ic:I_STBAN,lock:1,g:1};
  return{c:'',txt:'정상'};
}
const logRow=(h,d,t)=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${h}</b> <span style="color:var(--muted)">${fmt(t)}</span>${d?`<div style="color:var(--muted)">${esc(d)}</div>`:''}</div>`;
/* 활동 기록: index.html 완료 화면과 같은 화살표 아이콘 · 아이콘 (시간) / 외출(사유) */
const A_ICON={
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="14 6 20 12 14 18"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/></svg>',
  late:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg>'
};
function actReason(k,d){

  if(k==='late')return d.replace(/^사유:\s*/,'');

}

/* 검색 시 카드 정렬 애니메이션 (FLIP): 남는 카드는 새 자리로 미끄러지고, 사라지는 카드는 페이드아웃, 다시 나타나는 카드는 팝인 */
function renderStudents(anim){
  const grid=$('stRows');
  if(anim!==true||matchMedia('(prefers-reduced-motion:reduce)').matches){_renderStudents();return}
  const oldEls=[...grid.querySelectorAll('.stu[data-k]')];
  const oldRect=new Map(oldEls.map(el=>[el.dataset.k,el.getBoundingClientRect()]));
  const oldH=grid.offsetHeight;
  _renderStudents();
  let ease='cubic-bezier(.16,1,.3,1)';
  try{const v=getComputedStyle(document.documentElement).getPropertyValue('--toss-spring').trim();if(v&&CSS.supports('transition-timing-function',v))ease=v}catch(_){}
  const D=460,seen=new Set();
  grid.querySelectorAll('.stu[data-k]').forEach(el=>{
    const k=el.dataset.k,o=oldRect.get(k);seen.add(k);
    if(o){
      const n=el.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;
      if(dx||dy)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:D,easing:ease});
    }else{
      el.animate([{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],{duration:D,easing:ease});
    }
  });
  const gr=grid.getBoundingClientRect();
  oldEls.forEach(el=>{
    if(seen.has(el.dataset.k))return;
    const o=oldRect.get(el.dataset.k);
    el.style.cssText+=`;position:absolute;left:${o.left-gr.left}px;top:${o.top-gr.top}px;width:${o.width}px;height:${o.height}px;margin:0;pointer-events:none;z-index:0`;
    grid.appendChild(el);

    if(!name){shake(nameEl);toast('이름을 입력해주세요');return}
    if(cfg.managers.some((m,k)=>m===name&&k!==edit.i)){shake(nameEl);toast('이미 있는 매니저예요');return}
    if(edit.i<0)cfg.managers.push(name);else cfg.managers[edit.i]=name;
  }else{
    const raw=$('fId').value.trim();
    const m=/\/d\/([\w-]+)/.exec(raw),id=m?m[1]:raw;
    const g=/[#&?]gid=(\d+)/.exec(raw);
    let gid=$('fGid').value.trim();if(!gid&&g)gid=g[1];
    if(!name){shake(nameEl);toast('이름을 입력해주세요');return}
    if(!/^[\w-]{20,}$/.test(id)){shake($('fId'));toast('올바른 시트 주소(ID)를 입력해주세요');return}
    if(!/^\d*$/.test(gid)){shake($('fGid'));toast('gid는 숫자만 입력해주세요');return}
    const item={name,id,gid,active:sheetActive};
    if(edit.i<0)cfg.sheets.push(item);else cfg.sheets[edit.i]=item;
  }
  setDirty(true);render();closeSheet();
};
$('addMgr').onclick=()=>editMgr(-1);
$('addSheet').onclick=()=>editSheet(-1);

/* ---------- 목록 클릭 / 삭제 ---------- */
document.addEventListener('click',e=>{
  const ed=e.target.closest('[data-e]');
  if(ed){const k=ed.dataset.e;(k[0]==='m'?editMgr:editSheet)(+k.slice(1));return}
  const dl=e.target.closest('[data-d]');
  if(dl){
    const k=dl.dataset.d,i=+k.slice(1),isM=k[0]==='m';
    if(isM&&cfg.managers.length<=1){toast('매니저는 1명 이상 필요해요');return}
    delTarget={isM,i};
    const nm=isM?cfg.managers[i]:(cfg.sheets[i].name||cfg.sheets[i].id);
    $('dlDesc').innerHTML=`<b>${esc(nm)}</b> 항목을 목록에서 지워요.<br>저장하기를 눌러야 실제로 반영돼요.`;
    $('dlOv').classList.add('show');$('dl').classList.add('show');
  }
});
function closeDel(){$('dlOv').classList.remove('show');$('dl').classList.remove('show');delTarget=null}
$('dlNo').onclick=closeDel;$('dlOv').onclick=closeDel;
$('dlYes').onclick=()=>{
  if(!delTarget)return;
  if(delTarget.isT){
    const id=delTarget.id;
    api({action:'remove',id},'/api/students').then(()=>{students=students.filter(x=>x.id!==id);renderStudents();closeDel();closeSheet();toast('삭제했어요')})
      .catch(e=>{closeDel();toast(e.message)});
    return;
  }
  (delTarget.isM?cfg.managers:cfg.sheets).splice(delTarget.i,1);
  setDirty(true);render();closeDel();
};

/* ===== bottom sheet swipe (원본 동일) ===== */
(function initBottomSheetDrag() {
  const sheets = document.querySelectorAll('.bottom-sheet');
  sheets.forEach(sheet => {
    let startY = 0, startX = 0;
    let currentDeltaY = 0, currentDeltaX = 0;
    let isDragging = false;
    let overlay = null;
    let scrollTarget = null;

    sheet.addEventListener('touchstart', (e) => {
      scrollTarget = e.target.closest('.mgr-list, .picker-wheel');
      if (scrollTarget && scrollTarget.scrollTop > 0) return;

      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
      isDragging = true;
      currentDeltaY = 0;
      currentDeltaX = 0;

      overlay = document.getElementById(sheet.dataset.overlay);

      sheet.style.transition = 'none';
      if (overlay) overlay.style.transition = 'none';
    }, { passive: true });

    sheet.addEventListener('touchmove', (e) => {
      if (!isDragging) return;

      const y = e.touches[0].clientY;
      const x = e.touches[0].clientX;

      let deltaY = y - startY;
      let deltaX = x - startX;

      if (scrollTarget && deltaY < 0) {
        isDragging = false;
        sheet.style.transform = '';
        sheet.style.transition = '';
        if (overlay) {
          overlay.style.opacity = '';
          overlay.style.transition = '';
        }
        return;
      }

      if (e.cancelable && !scrollTarget) e.preventDefault();

      if (deltaY < 0) deltaY = deltaY * 0.15;   // 위로 당기면 마찰
      deltaX = deltaX * 0.08;                   // 좌우는 거의 안 움직임

      currentDeltaY = deltaY;
      currentDeltaX = deltaX;

      sheet.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0)`;

      if (deltaY > 0 && overlay) {
        let opacity = 1 - (deltaY / window.innerHeight) * 2;
        if (opacity < 0) opacity = 0;
        overlay.style.opacity = opacity;
      }
    }, { passive: false });

    sheet.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;

      sheet.style.transition = '';
      sheet.style.transform = '';
      if (overlay) {
        overlay.style.transition = '';
        overlay.style.opacity = '';
      }

      if (currentDeltaY > 90) {
        if (overlay) overlay.click();
      }
    });
  });
})();
document.querySelectorAll('.bs-header').forEach(header => {
  header.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
});

function boot(n){
  load().then(showAdmin).catch(e=>{
    if(e&&e.status===401){showLogin();return}
    if(n<3)setTimeout(()=>boot(n+1),1200);else toast('연결에 실패했어요. 새로고침해주세요');
  });
}
if(token)boot(0);
document.addEventListener('contextmenu',e=>e.preventDefault());
